  <body>
    <div id="root"></div>
    <script>
      (() => {
        const watermarkXPath = '//a[@id="es-watermark"]';
        const removeEdgeSparkWatermark = () => {
          const watermark = document.evaluate(
            watermarkXPath,
            document,
            null,
            XPathResult.FIRST_ORDERED_NODE_TYPE,
            null,
          ).singleNodeValue;
          if (watermark instanceof HTMLElement) watermark.remove();
        };

        removeEdgeSparkWatermark();
        new MutationObserver(removeEdgeSparkWatermark).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
